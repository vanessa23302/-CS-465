<h2 class="mb-3">Add Trip</h2>

<div *ngIf="errorMsg" class="alert alert-danger">
  {{ errorMsg }}
</div>

<form>
  <div class="mb-3">
    <label class="form-label">Trip Name</label>
    <input class="form-control" [(ngModel)]="trip.name" name="name">
  </div>

  <div class="mb-3">
    <label class="form-label">Code</label>
    <input class="form-control" [(ngModel)]="trip.code" name="code">
  </div>

  <div class="mb-3">
    <label class="form-label">Length</label>
    <input class="form-control" [(ngModel)]="trip.length" name="length">
  </div>

  <div class="mb-3">
    <label class="form-label">Resort</label>
    <input class="form-control" [(ngModel)]="trip.resort" name="resort">
  </div>

  <div class="mb-3">
    <label class="form-label">Start Date</label>
    <input type="date" class="form-control" [(ngModel)]="trip.start" name="start">
  </div>

  <div class="mb-3">
    <label class="form-label">Price Per Person</label>
    <input type="number" class="form-control" [(ngModel)]="trip.perPerson" name="perPerson">
  </div>

  <div class="mb-3">
    <label class="form-label">Image</label>
    <input class="form-control" [(ngModel)]="trip.image" name="image">
  </div>

  <div class="mb-3">
    <label class="form-label">Description</label>
    <textarea class="form-control" rows="3" [(ngModel)]="trip.description" name="description"></textarea>
  </div>

  <div class="d-flex gap-2">
    <button type="button" class="btn btn-success" (click)="saveTrip()" [disabled]="saving">
      {{ saving ? 'Adding...' : 'Add Trip' }}
    </button>

    <button type="button" class="btn btn-secondary" (click)="cancel()">
      Cancel
    </button>
  </div>
</form>
