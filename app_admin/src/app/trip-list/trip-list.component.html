<a class="btn btn-success mb-3" routerLink="/add">+ Add Trip</a>

<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Trip Listing</h2>
</div>

<div *ngIf="isLoading" class="alert alert-info">
  Loading trips...
</div>

<div *ngIf="!isLoading && loadError" class="alert alert-danger">
  {{ loadError }}
</div>

<div *ngIf="!isLoading && !loadError && trips.length === 0" class="alert alert-warning">
  No trips found in the database yet.
</div>

<app-trip-card *ngFor="let trip of trips" [trip]="trip"></app-trip-card>
