<div style="margin-bottom:15px;">

  <!-- ADMIN ONLY -->
  <button
    *ngIf="tripService.isLoggedIn()"
    routerLink="/add"
    class="btn btn-success">
    + Add Trip
  </button>

</div>

<h2>Trip Listing</h2>

<p *ngIf="isLoading">Loading trips...</p>

<p *ngIf="loadError" style="color:red;">
  {{ loadError }}
</p>

<div *ngIf="!isLoading && !loadError">
  <app-trip-card
    *ngFor="let trip of trips"
    [trip]="trip">
  </app-trip-card>
</div>
