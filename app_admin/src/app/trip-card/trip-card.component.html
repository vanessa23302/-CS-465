<div class="card mb-3" *ngIf="trip">
  <div class="card-body">

    <h5 class="card-title">{{ trip.name }}</h5>

    <p><strong>Code:</strong> {{ trip.code }}</p>
    <p><strong>Length:</strong> {{ trip.length }}</p>
    <p><strong>Resort:</strong> {{ trip.resort }}</p>
    <p><strong>Start:</strong> {{ trip.start | date }}</p>
    <p><strong>Per Person:</strong> {{ trip.perPerson }}</p>

    <!-- ADMIN ONLY -->
    <div *ngIf="tripService.isLoggedIn()" class="d-flex gap-2">

      <a class="btn btn-primary btn-sm"
         [routerLink]="['/edit', trip._id]">
         Edit
      </a>

      <button
        class="btn btn-danger btn-sm"
        (click)="deleteTrip()">
        Delete
      </button>

    </div>

  </div>
</div>
